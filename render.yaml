services:
  - type: web
    name: industrial-motor-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DEVICE_API_KEY
        sync: false
